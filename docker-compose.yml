services:
  postgres:
    image: postgres:16-alpine
    container_name: ilya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ilya
      POSTGRES_PASSWORD: ilya_dev_password
      POSTGRES_DB: ilya_dev
    ports:
      - "5432:5432"
    volumes:
      - ilya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilya -d ilya_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ilya_postgres_data:
